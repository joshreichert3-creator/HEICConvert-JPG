<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Tools</title>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f7f6f3; --surface: #ffffff; --surface2: #f1f0ec;
      --border: rgba(0,0,0,0.11); --border-md: rgba(0,0,0,0.20);
      --text: #1a1a18; --text-muted: #6b6b67; --text-faint: #9e9e9a;
      --blue-bg: #e6f1fb; --blue-text: #0c447c;
      --green-bg: #eaf3de; --green-text: #3b6d11;
      --red-bg: #fcebeb; --red-text: #a32d2d;
      --radius: 10px; --radius-lg: 14px;
    }
    @media (prefers-color-scheme: dark) { :root {
      --bg: #1a1a18; --surface: #242422; --surface2: #2e2e2b;
      --border: rgba(255,255,255,0.09); --border-md: rgba(255,255,255,0.18);
      --text: #f0efe9; --text-muted: #a0a09a; --text-faint: #68685f;
      --blue-bg: #042c53; --blue-text: #b5d4f4;
      --green-bg: #173404; --green-text: #c0dd97;
      --red-bg: #501313; --red-text: #f7c1c1;
    }}
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 2.5rem 1rem 4rem;
    }
    header { text-align: center; margin-bottom: 1.75rem; }
    header h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.02em; }
    header p { margin-top: 0.35rem; font-size: 0.85rem; color: var(--text-muted); }
    .tabs { display: flex; gap: 4px; background: var(--surface2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 4px; margin-bottom: 1.5rem; width: 100%; max-width: 640px; }
    .tab-btn { flex: 1; padding: 8px 6px; font-size: 0.82rem; font-weight: 500; border: none; background: none; border-radius: 7px; cursor: pointer; color: var(--text-muted); transition: background .12s, color .12s; font-family: inherit; }
    .tab-btn.active { background: var(--surface); color: var(--text); border: 0.5px solid var(--border); }
    .tab-btn:hover:not(.active) { color: var(--text); }
    .panel { display: none; width: 100%; max-width: 640px; }
    .panel.active { display: block; }
    .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; }
    .dropzone { border: 1.5px dashed var(--border-md); border-radius: var(--radius); padding: 2.25rem 1.5rem; text-align: center; cursor: pointer; transition: background .15s, border-color .15s; background: var(--surface2); }
    .dropzone:hover, .dropzone.over { border-color: #378add; background: var(--blue-bg); }
    .dropzone svg { width: 32px; height: 32px; stroke: var(--text-muted); margin: 0 auto 10px; display: block; }
    .dropzone p { font-size: 0.88rem; color: var(--text-muted); }
    .dropzone span { font-size: 0.76rem; color: var(--text-faint); margin-top: 4px; display: block; }
    input[type=file] { display: none; }
    .quality-row { display: flex; align-items: center; gap: 12px; margin-top: 1.1rem; }
    .quality-row label { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; }
    .quality-row input[type=range] { flex: 1; -webkit-appearance: none; height: 4px; border-radius: 2px; background: var(--border-md); outline: none; cursor: pointer; }
    .quality-row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; background: var(--text); cursor: pointer; }
    .qout { font-size: 0.8rem; font-weight: 500; min-width: 34px; text-align: right; }
    .file-list { margin-top: 1.1rem; display: flex; flex-direction: column; gap: 6px; }
    .file-row { background: var(--surface2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 8px 12px; display: flex; align-items: center; gap: 9px; }
    .file-row .name { flex: 1; font-size: 0.83rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-row .sz { font-size: 0.73rem; color: var(--text-faint); white-space: nowrap; }
    .badge { font-size: 0.7rem; font-weight: 500; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
    .b-wait { background: var(--surface2); color: var(--text-muted); border: 0.5px solid var(--border); }
    .b-prog { background: var(--blue-bg); color: var(--blue-text); }
    .b-done { background: var(--green-bg); color: var(--green-text); }
    .b-err  { background: var(--red-bg);  color: var(--red-text); }
    .dl-btn { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0.5px solid var(--border-md); border-radius: 7px; padding: 3px 9px; font-size: 0.74rem; cursor: pointer; color: var(--text); text-decoration: none; white-space: nowrap; transition: background .1s; font-family: inherit; }
    .dl-btn:hover { background: var(--surface2); }
    .dl-btn svg { width: 12px; height: 12px; stroke: currentColor; }
    .actions { display: flex; gap: 9px; margin-top: 1.1rem; }
    .primary-btn { flex: 1; padding: 10px; font-size: 0.86rem; font-weight: 500; border-radius: var(--radius); cursor: pointer; border: 0.5px solid var(--border-md); background: var(--surface); color: var(--text); transition: background .1s; font-family: inherit; }
    .primary-btn:hover:not(:disabled) { background: var(--surface2); }
    .primary-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .dl-all-btn { display: none; align-items: center; gap: 6px; padding: 10px 14px; font-size: 0.86rem; border-radius: var(--radius); cursor: pointer; border: 0.5px solid var(--border-md); background: var(--surface); color: var(--text); transition: background .1s; font-family: inherit; }
    .dl-all-btn:hover { background: var(--surface2); }
    .dl-all-btn svg { width: 14px; height: 14px; stroke: currentColor; }
    .summary { font-size: 0.78rem; color: var(--text-muted); margin-top: 9px; min-height: 16px; text-align: center; }

    /* PDF editor */
    .pdf-meta { display: flex; align-items: center; justify-content: space-between; margin: 1rem 0 0.75rem; flex-wrap: wrap; gap: 6px; }
    .pdf-meta .pdf-name { font-size: 0.85rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 340px; }
    .pdf-meta .pdf-count { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; }
    .pdf-toolbar { display: flex; gap: 7px; margin-bottom: 1rem; flex-wrap: wrap; }
    .tool-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; font-size: 0.79rem; font-weight: 500; border-radius: var(--radius); cursor: pointer; border: 0.5px solid var(--border-md); background: var(--surface); color: var(--text); transition: background .1s; font-family: inherit; white-space: nowrap; }
    .tool-btn:hover:not(:disabled) { background: var(--surface2); }
    .tool-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .tool-btn svg { width: 13px; height: 13px; stroke: currentColor; flex-shrink: 0; }
    .tool-btn.red { border-color: var(--red-text); color: var(--red-text); }
    .tool-btn.red:hover:not(:disabled) { background: var(--red-bg); }

    /* Page grid with thumbnails */
    .page-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .page-card { background: var(--surface2); border: 2px solid transparent; border-radius: var(--radius); padding: 8px 8px 6px; cursor: pointer; transition: border-color .12s, box-shadow .12s; display: flex; flex-direction: column; align-items: center; gap: 5px; user-select: none; }
    .page-card:hover { border-color: var(--border-md); }
    .page-card.selected { border-color: #378add; box-shadow: 0 0 0 3px rgba(55,138,221,0.15); }
    .page-card.dragging { opacity: 0.35; }
    .page-card.drag-over { border-color: #378add; border-style: dashed; }
    .thumb-wrap { width: 100%; background: white; border-radius: 4px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.13); display: flex; align-items: center; justify-content: center; min-height: 80px; }
    .thumb-wrap canvas { width: 100%; height: auto; display: block; }
    .thumb-wrap .thumb-loading { font-size: 0.7rem; color: var(--text-faint); padding: 20px 0; }
    .page-num { font-size: 0.72rem; color: var(--text-muted); }
    .drag-hint { font-size: 0.62rem; color: var(--text-faint); }

    footer { margin-top: 2.5rem; font-size: 0.76rem; color: var(--text-faint); text-align: center; }
  </style>
</head>
<body>

<header>
  <h1>File Tools</h1>
  <p>HEIC → JPG &nbsp;·&nbsp; PDF Page Editor</p>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('heic',this)">HEIC → JPG</button>
  <button class="tab-btn" onclick="switchTab('pdf',this); initPdfTab();">PDF Page Editor</button>
</div>

<!-- HEIC -->
<div class="panel active" id="panel-heic">
  <div class="card">
    <div class="dropzone" id="heic-drop">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <p>Drop .heic files here, or click to browse</p>
      <span>Multiple files supported</span>
    </div>
    <input type="file" id="heic-input" accept=".heic,.HEIC,image/heic,image/heif" multiple>
    <div class="quality-row">
      <label for="heic-quality">JPG quality</label>
      <input type="range" id="heic-quality" min="50" max="100" step="1" value="90">
      <span class="qout" id="heic-qout">90%</span>
    </div>
    <div class="file-list" id="heic-list"></div>
    <div class="actions">
      <button class="primary-btn" id="heic-btn" disabled>Convert all</button>
      <button class="dl-all-btn" id="heic-dl-all">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download all
      </button>
    </div>
    <div class="summary" id="heic-summary"></div>
  </div>
</div>

<!-- PDF PAGE EDITOR -->
<div class="panel" id="panel-pdf">
  <div class="card">
    <div id="pdf-loading-msg" style="text-align:center;padding:1.5rem;font-size:0.85rem;color:var(--text-muted);display:none">Loading PDF viewer…</div>
    <div class="dropzone" id="pdf-drop" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
      <p>Drop a PDF here, or click to browse</p>
      <span>Reorder, delete, or add pages — then save</span>
    </div>
    <input type="file" id="pdf-input" accept=".pdf,application/pdf">

    <div id="pdf-editor" style="display:none">
      <div class="pdf-meta">
        <span class="pdf-name" id="pdf-fname"></span>
        <span class="pdf-count" id="pdf-pcount"></span>
      </div>
      <div class="pdf-toolbar">
        <button class="tool-btn" id="btn-up" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Move left
        </button>
        <button class="tool-btn" id="btn-down" disabled>
          Move right
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="tool-btn red" id="btn-del" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
          Delete
        </button>
        <label class="tool-btn" style="cursor:pointer">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add PDF
          <input type="file" id="pdf-add" accept=".pdf,application/pdf">
        </label>
      </div>
      <div class="page-grid" id="page-grid"></div>
      <div class="actions">
        <button class="primary-btn" id="btn-save">Save PDF</button>
      </div>
      <div class="summary" id="pdf-summary"></div>
    </div>
  </div>
</div>

<footer>All processing happens in your browser · No data leaves your device</footer>

<script>
var DL = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

function switchTab(name, btn) {
  document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('panel-' + name).classList.add('active');
  btn.classList.add('active');
}

function fmtSize(b) { return b < 1048576 ? Math.round(b/1024)+' KB' : (b/1048576).toFixed(1)+' MB'; }

function setupDrop(dropId, inputId, onFiles) {
  var drop = document.getElementById(dropId);
  var inp  = document.getElementById(inputId);
  drop.addEventListener('click', function() { inp.click(); });
  drop.addEventListener('dragover', function(e) { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', function() { drop.classList.remove('over'); });
  drop.addEventListener('drop', function(e) { e.preventDefault(); drop.classList.remove('over'); onFiles(Array.from(e.dataTransfer.files)); });
  inp.addEventListener('change', function() { onFiles(Array.from(inp.files)); inp.value=''; });
}

/* ══ HEIC ══ */
(function() {
  var list=document.getElementById('heic-list'), btn=document.getElementById('heic-btn'),
      dlAll=document.getElementById('heic-dl-all'), sum=document.getElementById('heic-summary'),
      qual=document.getElementById('heic-quality'), qout=document.getElementById('heic-qout');
  var files=[], results={};
  qual.oninput = function() { qout.textContent = qual.value+'%'; };
  setupDrop('heic-drop','heic-input', add);
  function add(nf) {
    var h=nf.filter(function(f){return /\.heic$/i.test(f.name)||f.type==='image/heic'||f.type==='image/heif';});
    if(!h.length){sum.textContent='No .heic files found.';return;}
    h.forEach(function(f){if(!files.find(function(x){return x.name===f.name&&x.size===f.size;}))files.push(f);});
    results={}; render(); btn.disabled=false; sum.textContent=''; dlAll.style.display='none';
  }
  function render() {
    list.innerHTML='';
    files.forEach(function(f,i) {
      var res=results[i];
      var badge='<span class="badge b-wait">Waiting</span>';
      if(res==='converting') badge='<span class="badge b-prog">Converting…</span>';
      else if(res==='error') badge='<span class="badge b-err">Error</span>';
      else if(res&&res.url)  badge='<span class="badge b-done">Done</span>';
      var dl=(res&&res.url)?'<a class="dl-btn" href="'+res.url+'" download="'+res.name+'">'+DL+' Save</a>':'';
      var row=document.createElement('div'); row.className='file-row';
      row.innerHTML='<span class="name" title="'+f.name+'">'+f.name+'</span><span class="sz">'+fmtSize(f.size)+'</span>'+badge+dl;
      list.appendChild(row);
    });
  }
  btn.addEventListener('click', function() {
    if(!files.length) return;
    btn.disabled=true; dlAll.style.display='none'; sum.textContent='Converting…';
    var q=parseInt(qual.value)/100, i=0;
    function next() {
      if(i>=files.length) {
        var done=Object.values(results).filter(function(r){return r&&r.url;}).length;
        var err=Object.values(results).filter(function(r){return r==='error';}).length;
        sum.textContent=done+' converted'+(err?', '+err+' failed':'')+'.';
        btn.disabled=false; if(done>1) dlAll.style.display='flex'; return;
      }
      if(results[i]&&results[i].url){i++;next();return;}
      results[i]='converting'; render();
      var f=files[i];
      heic2any({blob:f,toType:'image/jpeg',quality:q})
        .then(function(blob){if(Array.isArray(blob))blob=blob[0];results[i]={url:URL.createObjectURL(blob),name:f.name.replace(/\.heic$/i,'.jpg')};i++;render();next();})
        .catch(function(e){console.error(e);results[i]='error';i++;render();next();});
    }
    next();
  });
  dlAll.addEventListener('click', function() {
    var items=Object.values(results).filter(function(r){return r&&r.url;}), i=0;
    function next(){if(i>=items.length)return;var a=document.createElement('a');a.href=items[i].url;a.download=items[i].name;a.click();i++;setTimeout(next,160);}
    next();
  });
})();

/* ══ PDF PAGE EDITOR ══ */
var pdfTabReady = false;

function initPdfTab() {
  if(pdfTabReady) return;
  // Show loading, then inject pdf.js lazily
  var loadMsg = document.getElementById('pdf-loading-msg');
  loadMsg.style.display = 'block';

  var script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.min.js';
  script.onload = function() {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.worker.min.js';
    loadMsg.style.display = 'none';
    document.getElementById('pdf-drop').style.display = '';
    pdfTabReady = true;
    startPdfEditor();
  };
  script.onerror = function() {
    loadMsg.textContent = 'Failed to load PDF viewer. Check your internet connection.';
  };
  document.head.appendChild(script);
}

function startPdfEditor() {
  var grid     = document.getElementById('page-grid');
  var editor   = document.getElementById('pdf-editor');
  var fnameEl  = document.getElementById('pdf-fname');
  var pcountEl = document.getElementById('pdf-pcount');
  var btnUp    = document.getElementById('btn-up');
  var btnDown  = document.getElementById('btn-down');
  var btnDel   = document.getElementById('btn-del');
  var btnSave  = document.getElementById('btn-save');
  var sum      = document.getElementById('pdf-summary');
  var addInput = document.getElementById('pdf-add');

  // pages = [{ buf, srcIndex, label, canvas }]
  var pages = [], sel = -1, dragSrc = null, origName = 'document.pdf';

  setupDrop('pdf-drop','pdf-input', function(files){ if(files[0]) loadPDF(files[0], true); });
  addInput.addEventListener('change', function() { if(addInput.files[0]) loadPDF(addInput.files[0], false); addInput.value=''; });

  function loadPDF(file, replace) {
    sum.textContent = replace ? 'Loading…' : 'Adding pages…';
    file.arrayBuffer().then(function(buf) {
      // Count pages with pdf-lib (fast, no rendering)
      return PDFLib.PDFDocument.load(buf).then(function(doc) {
        var count = doc.getPageCount();
        if(replace) { pages=[]; sel=-1; origName=file.name; fnameEl.textContent=file.name; }
        for(var i=0;i<count;i++) {
          pages.push({ buf: buf, srcIndex: i, label: file.name, canvas: null });
        }
        editor.style.display = 'block';
        document.getElementById('pdf-drop').style.display = 'none';
        renderGrid();
        sum.textContent = replace ? '' : count+' pages added.';
        // Now render thumbnails progressively in background
        renderThumbnails(buf, replace ? 0 : pages.length - count, count);
      });
    }).catch(function(e) {
      sum.textContent = 'Could not read PDF. It may be password-protected.';
      console.error(e);
    });
  }

  // Render page thumbnails one by one without blocking the UI
  function renderThumbnails(buf, startIdx, count) {
    pdfjsLib.getDocument({ data: buf.slice(0) }).promise.then(function(pdfDoc) {
      var i = 0;
      function nextThumb() {
        if(i >= count) return;
        var pageNum = i + 1;
        var globalIdx = startIdx + i;
        pdfDoc.getPage(pageNum).then(function(page) {
          var vp = page.getViewport({ scale: 1 });
          var scale = 180 / vp.width;
          var viewport = page.getViewport({ scale: scale });
          var canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          return page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise.then(function() {
            if(pages[globalIdx]) {
              pages[globalIdx].canvas = canvas;
              updateThumb(globalIdx, canvas);
            }
            i++;
            nextThumb();
          });
        }).catch(function() { i++; nextThumb(); });
      }
      nextThumb();
    });
  }

  function updateThumb(idx, canvas) {
    var card = grid.children[idx];
    if(!card) return;
    var wrap = card.querySelector('.thumb-wrap');
    if(!wrap) return;
    wrap.innerHTML = '';
    wrap.appendChild(canvas.cloneNode(true));
  }

  function renderGrid() {
    grid.innerHTML = '';
    pcountEl.textContent = pages.length + ' page' + (pages.length!==1?'s':'');
    pages.forEach(function(pg, i) {
      var card = document.createElement('div');
      card.className = 'page-card' + (i===sel?' selected':'');
      card.draggable = true;

      var wrap = document.createElement('div');
      wrap.className = 'thumb-wrap';
      if(pg.canvas) {
        wrap.appendChild(pg.canvas.cloneNode(true));
      } else {
        var loading = document.createElement('div');
        loading.className = 'thumb-loading';
        loading.textContent = 'Loading…';
        wrap.appendChild(loading);
      }
      card.appendChild(wrap);

      var num = document.createElement('div'); num.className='page-num'; num.textContent='Page '+(i+1);
      var hint = document.createElement('div'); hint.className='drag-hint'; hint.textContent='drag to reorder';
      card.appendChild(num);
      card.appendChild(hint);

      card.addEventListener('click', function() { sel=i; renderGrid(); updateBtns(); });

      card.addEventListener('dragstart', function(e) { dragSrc=i; card.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
      card.addEventListener('dragend',   function() { card.classList.remove('dragging'); renderGrid(); });
      card.addEventListener('dragover',  function(e) { e.preventDefault(); card.classList.add('drag-over'); });
      card.addEventListener('dragleave', function() { card.classList.remove('drag-over'); });
      card.addEventListener('drop', function(e) {
        e.preventDefault(); card.classList.remove('drag-over');
        if(dragSrc===null||dragSrc===i) return;
        var moved=pages.splice(dragSrc,1)[0]; pages.splice(i,0,moved);
        sel=i; dragSrc=null; renderGrid(); updateBtns();
      });

      grid.appendChild(card);
    });
    updateBtns();
  }

  function updateBtns() {
    var ok = sel>=0 && sel<pages.length;
    btnUp.disabled   = !ok || sel===0;
    btnDown.disabled = !ok || sel===pages.length-1;
    btnDel.disabled  = !ok || pages.length<=1;
  }

  btnUp.addEventListener('click', function() {
    if(sel<=0) return;
    var t=pages[sel]; pages[sel]=pages[sel-1]; pages[sel-1]=t; sel--; renderGrid();
  });
  btnDown.addEventListener('click', function() {
    if(sel>=pages.length-1) return;
    var t=pages[sel]; pages[sel]=pages[sel+1]; pages[sel+1]=t; sel++; renderGrid();
  });
  btnDel.addEventListener('click', function() {
    if(pages.length<=1||sel<0) return;
    pages.splice(sel,1);
    if(sel>=pages.length) sel=pages.length-1;
    renderGrid(); sum.textContent='Page deleted.';
  });

  btnSave.addEventListener('click', function() {
    btnSave.disabled=true; sum.textContent='Building PDF…';
    var bufs=[], bufDocs={};
    pages.forEach(function(pg){ if(bufs.indexOf(pg.buf)===-1) bufs.push(pg.buf); });
    var chain=Promise.resolve();
    bufs.forEach(function(buf,bi) {
      chain=chain.then(function(){ return PDFLib.PDFDocument.load(buf).then(function(doc){ bufDocs[bi]=doc; }); });
    });
    chain.then(function(){ return PDFLib.PDFDocument.create(); }).then(function(outDoc) {
      var c=Promise.resolve();
      pages.forEach(function(pg) {
        var bi=bufs.indexOf(pg.buf);
        c=c.then(function(){ return outDoc.copyPages(bufDocs[bi],[pg.srcIndex]).then(function(cp){ outDoc.addPage(cp[0]); }); });
      });
      return c.then(function(){ return outDoc.save(); });
    }).then(function(bytes) {
      var blob=new Blob([bytes],{type:'application/pdf'});
      var url=URL.createObjectURL(blob);
      var name=origName.replace(/\.pdf$/i,'_edited.pdf');
      var a=document.createElement('a'); a.href=url; a.download=name; a.click();
      sum.textContent='Saved as '+name;
      btnSave.disabled=false;
    }).catch(function(e) {
      sum.textContent='Error saving PDF.'; console.error(e); btnSave.disabled=false;
    });
  });
}
</script>
</body>
</html>
