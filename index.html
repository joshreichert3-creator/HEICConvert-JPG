<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HEIC → JPG Converter</title>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f7f6f3; --surface: #ffffff; --surface2: #f1f0ec;
      --border: rgba(0,0,0,0.11); --border-md: rgba(0,0,0,0.20);
      --text: #1a1a18; --text-muted: #6b6b67; --text-faint: #9e9e9a;
      --blue-bg: #e6f1fb; --blue-text: #0c447c;
      --green-bg: #eaf3de; --green-text: #3b6d11;
      --red-bg: #fcebeb; --red-text: #a32d2d;
      --radius: 10px; --radius-lg: 14px;
    }
    @media (prefers-color-scheme: dark) { :root {
      --bg: #1a1a18; --surface: #242422; --surface2: #2e2e2b;
      --border: rgba(255,255,255,0.09); --border-md: rgba(255,255,255,0.18);
      --text: #f0efe9; --text-muted: #a0a09a; --text-faint: #68685f;
      --blue-bg: #042c53; --blue-text: #b5d4f4;
      --green-bg: #173404; --green-text: #c0dd97;
      --red-bg: #501313; --red-text: #f7c1c1;
    }}
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 3rem 1rem 4rem;
    }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.02em; }
    header p { margin-top: 0.4rem; font-size: 0.9rem; color: var(--text-muted); }
    .card {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 1.5rem;
      width: 100%; max-width: 560px;
    }
    .dropzone {
      border: 1.5px dashed var(--border-md); border-radius: var(--radius);
      padding: 2.5rem 1.5rem; text-align: center; cursor: pointer;
      transition: background 0.15s, border-color 0.15s; background: var(--surface2);
    }
    .dropzone:hover, .dropzone.over { border-color: #378add; background: var(--blue-bg); }
    .dropzone svg { width: 36px; height: 36px; stroke: var(--text-muted); margin: 0 auto 10px; display: block; }
    .dropzone p { font-size: 0.9rem; color: var(--text-muted); }
    .dropzone span { font-size: 0.78rem; color: var(--text-faint); margin-top: 4px; display: block; }
    input[type=file] { display: none; }
    .quality-row { display: flex; align-items: center; gap: 12px; margin-top: 1.25rem; }
    .quality-row label { font-size: 0.82rem; color: var(--text-muted); white-space: nowrap; }
    .quality-row input[type=range] {
      flex: 1; -webkit-appearance: none; height: 4px;
      border-radius: 2px; background: var(--border-md); outline: none; cursor: pointer;
    }
    .quality-row input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px;
      border-radius: 50%; background: var(--text); cursor: pointer;
    }
    .qout { font-size: 0.82rem; font-weight: 500; min-width: 34px; text-align: right; }
    .file-list { margin-top: 1.25rem; display: flex; flex-direction: column; gap: 7px; }
    .file-row {
      background: var(--surface2); border: 0.5px solid var(--border);
      border-radius: var(--radius); padding: 9px 13px;
      display: flex; align-items: center; gap: 10px;
    }
    .file-row .name { flex: 1; font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-row .sz { font-size: 0.75rem; color: var(--text-faint); white-space: nowrap; }
    .badge { font-size: 0.72rem; font-weight: 500; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
    .b-wait { background: var(--surface2); color: var(--text-muted); border: 0.5px solid var(--border); }
    .b-prog { background: var(--blue-bg); color: var(--blue-text); }
    .b-done { background: var(--green-bg); color: var(--green-text); }
    .b-err  { background: var(--red-bg);  color: var(--red-text); }
    .dl-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: none; border: 0.5px solid var(--border-md);
      border-radius: 7px; padding: 4px 10px; font-size: 0.76rem;
      cursor: pointer; color: var(--text); text-decoration: none;
      white-space: nowrap; transition: background 0.1s; font-family: inherit;
    }
    .dl-btn:hover { background: var(--surface2); }
    .dl-btn svg { width: 13px; height: 13px; stroke: currentColor; }
    .actions { display: flex; gap: 10px; margin-top: 1.25rem; }
    .primary-btn {
      flex: 1; padding: 10px; font-size: 0.88rem; font-weight: 500;
      border-radius: var(--radius); cursor: pointer;
      border: 0.5px solid var(--border-md);
      background: var(--surface); color: var(--text);
      transition: background 0.1s; font-family: inherit;
    }
    .primary-btn:hover:not(:disabled) { background: var(--surface2); }
    .primary-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .dl-all-btn {
      display: none; align-items: center; gap: 6px;
      padding: 10px 16px; font-size: 0.88rem; border-radius: var(--radius);
      cursor: pointer; border: 0.5px solid var(--border-md);
      background: var(--surface); color: var(--text);
      transition: background 0.1s; font-family: inherit;
    }
    .dl-all-btn:hover { background: var(--surface2); }
    .dl-all-btn svg { width: 15px; height: 15px; stroke: currentColor; }
    .summary { font-size: 0.8rem; color: var(--text-muted); margin-top: 10px; min-height: 18px; text-align: center; }
    footer { margin-top: 2.5rem; font-size: 0.78rem; color: var(--text-faint); text-align: center; }
  </style>
</head>
<body>

<header>
  <h1>HEIC → JPG</h1>
  <p>Convert photos locally — nothing is uploaded to any server</p>
</header>

<div class="card">
  <div class="dropzone" id="dropzone">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
    <p>Drop .heic files here, or click to browse</p>
    <span>Multiple files supported</span>
  </div>
  <input type="file" id="file-input" accept=".heic,.HEIC,image/heic,image/heif" multiple>

  <div class="quality-row">
    <label for="quality">JPG quality</label>
    <input type="range" id="quality" min="50" max="100" step="1" value="90">
    <span class="qout" id="qout">90%</span>
  </div>

  <div class="file-list" id="file-list"></div>

  <div class="actions">
    <button class="primary-btn" id="convert-btn" disabled>Convert all</button>
    <button class="dl-all-btn" id="dl-all-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Download all
    </button>
  </div>
  <div class="summary" id="summary"></div>
</div>

<footer>All processing happens in your browser. No data leaves your device.</footer>

<script>
  var dropzone   = document.getElementById('dropzone');
  var fileInput  = document.getElementById('file-input');
  var fileList   = document.getElementById('file-list');
  var convertBtn = document.getElementById('convert-btn');
  var dlAllBtn   = document.getElementById('dl-all-btn');
  var summary    = document.getElementById('summary');
  var qualSlider = document.getElementById('quality');
  var qualOut    = document.getElementById('qout');

  var files = [], results = {};

  var DL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

  qualSlider.oninput = function() { qualOut.textContent = qualSlider.value + '%'; };

  dropzone.addEventListener('click', function() { fileInput.click(); });
  dropzone.addEventListener('dragover', function(e) { e.preventDefault(); dropzone.classList.add('over'); });
  dropzone.addEventListener('dragleave', function() { dropzone.classList.remove('over'); });
  dropzone.addEventListener('drop', function(e) { e.preventDefault(); dropzone.classList.remove('over'); addFiles(Array.from(e.dataTransfer.files)); });
  fileInput.addEventListener('change', function() { addFiles(Array.from(fileInput.files)); fileInput.value = ''; });

  function fmtSize(b) {
    return b < 1048576 ? Math.round(b / 1024) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
  }

  function addFiles(newFiles) {
    var heics = newFiles.filter(function(f) {
      return /\.heic$/i.test(f.name) || f.type === 'image/heic' || f.type === 'image/heif';
    });
    if (!heics.length) { summary.textContent = 'No .heic files found in that selection.'; return; }
    heics.forEach(function(f) {
      if (!files.find(function(x) { return x.name === f.name && x.size === f.size; })) files.push(f);
    });
    results = {}; renderList(); convertBtn.disabled = false; summary.textContent = ''; dlAllBtn.style.display = 'none';
  }

  function renderList() {
    fileList.innerHTML = '';
    files.forEach(function(f, i) {
      var res = results[i];
      var badge = '<span class="badge b-wait">Waiting</span>';
      if (res === 'converting') badge = '<span class="badge b-prog">Converting…</span>';
      else if (res === 'error')  badge = '<span class="badge b-err">Error</span>';
      else if (res && res.url)   badge = '<span class="badge b-done">Done</span>';
      var dl = (res && res.url) ? '<a class="dl-btn" href="' + res.url + '" download="' + res.name + '">' + DL_ICON + ' Save</a>' : '';
      var row = document.createElement('div');
      row.className = 'file-row';
      row.innerHTML = '<span class="name" title="' + f.name + '">' + f.name + '</span><span class="sz">' + fmtSize(f.size) + '</span>' + badge + dl;
      fileList.appendChild(row);
    });
  }

  convertBtn.addEventListener('click', function() {
    if (!files.length) return;
    convertBtn.disabled = true; dlAllBtn.style.display = 'none'; summary.textContent = 'Converting…';
    var q = parseInt(qualSlider.value) / 100;
    var i = 0;
    function next() {
      if (i >= files.length) {
        var done = Object.values(results).filter(function(r) { return r && r.url; }).length;
        var err  = Object.values(results).filter(function(r) { return r === 'error'; }).length;
        summary.textContent = done + ' converted' + (err ? ', ' + err + ' failed' : '') + '.';
        convertBtn.disabled = false;
        if (done > 1) dlAllBtn.style.display = 'flex';
        return;
      }
      if (results[i] && results[i].url) { i++; next(); return; }
      results[i] = 'converting'; renderList();
      heic2any({ blob: files[i], toType: 'image/jpeg', quality: q })
        .then(function(blob) {
          if (Array.isArray(blob)) blob = blob[0];
          results[i] = { url: URL.createObjectURL(blob), name: files[i].name.replace(/\.heic$/i, '.jpg') };
          i++; renderList(); next();
        })
        .catch(function(e) {
          console.error('heic2any error:', e);
          results[i] = 'error';
          i++; renderList(); next();
        });
    }
    next();
  });

  dlAllBtn.addEventListener('click', function() {
    var items = Object.values(results).filter(function(r) { return r && r.url; });
    var i = 0;
    function next() {
      if (i >= items.length) return;
      var a = document.createElement('a'); a.href = items[i].url; a.download = items[i].name; a.click();
      i++; setTimeout(next, 160);
    }
    next();
  });
</script>
</body>
</html>
